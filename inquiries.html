<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiries - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .inquiry-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: white;
            padding: 15px 20px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }
        .stat-box .number { font-size: 28px; font-weight: 700; }
        .stat-box .label { font-size: 12px; color: var(--gray); }
        .stat-box .number.red { color: #dc2626; }
        .stat-box .number.blue { color: #3b82f6; }
        .stat-box .number.orange { color: #f59e0b; }
        .stat-box .number.green { color: #16a34a; }
        .stat-box .number.purple { color: #8b5cf6; }
        .stat-box.border-red { border-left-color: #dc2626; }
        .stat-box.border-blue { border-left-color: #3b82f6; }
        .stat-box.border-orange { border-left-color: #f59e0b; }
        .stat-box.border-green { border-left-color: #16a34a; }
        .stat-box.border-purple { border-left-color: #8b5cf6; }
        .inquiry-item {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border-left: 4px solid #3b82f6;
            transition: var(--transition);
        }
        .inquiry-item:hover { box-shadow: var(--shadow-lg); }
        .inquiry-item.status-new { border-left-color: #dc2626; background: #fef2f2; }
        .inquiry-item.status-read { border-left-color: #3b82f6; }
        .inquiry-item.status-replied { border-left-color: #f59e0b; }
        .inquiry-item.status-closed { border-left-color: #16a34a; opacity: 0.8; }
        .inquiry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .inquiry-header .name { font-weight: 700; font-size: 16px; }
        .inquiry-header .date { font-size: 12px; color: var(--gray); }
        .inquiry-body { color: var(--secondary); font-size: 14px; margin-bottom: 10px; }
        .inquiry-body .subject { font-weight: 600; color: var(--dark); display: block; margin-bottom: 5px; }
        .inquiry-body .message {
            margin-top: 5px;
            padding: 10px 15px;
            background: #f8fafc;
            border-radius: var(--radius);
            color: var(--dark);
        }
        .inquiry-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .inquiry-actions .btn-sm { padding: 4px 12px; font-size: 12px; }
        .badge-status {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-status.new { background: #fee2e2; color: #dc2626; }
        .badge-status.read { background: #dbeafe; color: #3b82f6; }
        .badge-status.replied { background: #fef3c7; color: #f59e0b; }
        .badge-status.closed { background: #dcfce7; color: #16a34a; }
        .reply-box {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: #f8fafc;
            border-radius: var(--radius);
        }
        .reply-box.show { display: block; }
        .reply-box textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .reply-box textarea:focus { outline: none; border-color: var(--primary); }
        .reply-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 6px 16px;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
        }
        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active { border-color: var(--primary); background: var(--primary); color: white; }
        .inquiry-subject-badge {
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: var(--secondary);
            display: inline-block;
        }
        .inquiry-contact { font-size: 13px; color: var(--secondary); margin-top: 5px; }
        .inquiry-contact i { margin-right: 5px; width: 16px; }
        .inquiry-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }
        .inquiry-empty i { font-size: 50px; display: block; margin-bottom: 15px; }
        @media (max-width: 600px) {
            .inquiry-stats { grid-template-columns: 1fr 1fr; }
            .inquiry-header { flex-direction: column; }
        }
    </style>
</head>
<body>

        <div class="sidebar-brand">
            <h2>
                <i class="fas fa-car"></i>
                <div>
                    EXCEL INSTITUTE
                    <span class="subtitle">Driving School</span>
                </div>
            </h2>
        </div>
        <!-- ✅ CORRECTED SIDEBAR - NO DUPLICATES -->
        <ul class="sidebar-menu">
            <li class="menu-label">Main</li>

            <li><a href="student-portal.html"><i class="fas fa-user-graduate"></i> Student Portal</a></li>
            <li class="menu-label">Reports</li>

        </ul>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-nav">
            <div class="top-nav-left">
                <button class="mobile-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Inquiries</h1>
            </div>
            <div class="top-nav-right">
                <div class="user-profile" onclick="handleLogout()">
                    <div class="user-avatar">A</div>
                    <span>Admin</span>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="inquiry-stats" id="inquiryStats">
            <div class="stat-box border-red">
                <div class="number red" id="totalNew">0</div>
                <div class="label">New</div>
            </div>
            <div class="stat-box border-blue">
                <div class="number blue" id="totalRead">0</div>
                <div class="label">Read</div>
            </div>
            <div class="stat-box border-orange">
                <div class="number orange" id="totalReplied">0</div>
                <div class="label">Replied</div>
            </div>
            <div class="stat-box border-green">
                <div class="number green" id="totalClosed">0</div>
                <div class="label">Closed</div>
            </div>
            <div class="stat-box border-purple">
                <div class="number purple" id="totalAll">0</div>
                <div class="label">Total</div>
            </div>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterInquiries('all', this)">All</button>
            <button class="filter-btn" onclick="filterInquiries('new', this)">New</button>
            <button class="filter-btn" onclick="filterInquiries('read', this)">Read</button>
            <button class="filter-btn" onclick="filterInquiries('replied', this)">Replied</button>
            <button class="filter-btn" onclick="filterInquiries('closed', this)">Closed</button>
        </div>

        <div id="inquiriesList"></div>
    </div>

    <script>
        var currentFilter = 'all';

        function loadInquiries() {
            var inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
            var container = document.getElementById('inquiriesList');

            var totalNew = inquiries.filter(function(i) { return i.status === 'new'; }).length;
            var totalRead = inquiries.filter(function(i) { return i.status === 'read'; }).length;
            var totalReplied = inquiries.filter(function(i) { return i.status === 'replied'; }).length;
            var totalClosed = inquiries.filter(function(i) { return i.status === 'closed'; }).length;

            document.getElementById('totalNew').textContent = totalNew;
            document.getElementById('totalRead').textContent = totalRead;
            document.getElementById('totalReplied').textContent = totalReplied;
            document.getElementById('totalClosed').textContent = totalClosed;
            document.getElementById('totalAll').textContent = inquiries.length;

            var filtered = inquiries;
            if (currentFilter !== 'all') {
                filtered = inquiries.filter(function(i) { return i.status === currentFilter; });
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="inquiry-empty"><i class="fas fa-inbox"></i><p>No inquiries found</p></div>';
                return;
            }

            container.innerHTML = filtered.map(function(inquiry) {
                var date = new Date(inquiry.date);
                var formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                var statusClass = inquiry.status;
                var statusLabel = inquiry.status.charAt(0).toUpperCase() + inquiry.status.slice(1);

                return '<div class="inquiry-item status-' + statusClass + '">' +
                    '<div class="inquiry-header">' +
                        '<div><span class="name">' + inquiry.name + '</span> <span class="badge-status ' + inquiry.status + '">' + statusLabel + '</span> <span class="inquiry-subject-badge">' + inquiry.subject + '</span></div>' +
                        '<div class="date"><i class="far fa-clock"></i> ' + formattedDate + '</div>' +
                    '</div>' +
                    '<div class="inquiry-contact"><i class="fas fa-phone"></i> ' + inquiry.phone + (inquiry.email !== 'Not provided' ? '<i class="fas fa-envelope" style="margin-left:15px;"></i> ' + inquiry.email : '') + '</div>' +
                    '<div class="inquiry-body"><div class="message">' + inquiry.message + '</div></div>' +
                    '<div class="inquiry-actions">' +
                        '<button onclick="markRead(' + inquiry.id + ')" class="btn btn-sm btn-primary"><i class="fas fa-check"></i> Mark Read</button>' +
                        '<button onclick="toggleReply(' + inquiry.id + ')" class="btn btn-sm btn-warning"><i class="fas fa-reply"></i> Reply</button>' +
                        '<button onclick="markClosed(' + inquiry.id + ')" class="btn btn-sm btn-success"><i class="fas fa-check-double"></i> Close</button>' +
                        '<button onclick="deleteInquiry(' + inquiry.id + ')" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i> Delete</button>' +
                    '</div>' +
                    '<div class="reply-box" id="reply-' + inquiry.id + '">' +
                        '<textarea id="replyText-' + inquiry.id + '" placeholder="Type your reply here..."></textarea>' +
                        '<div class="reply-actions">' +
                            '<button onclick="sendReply(' + inquiry.id + ')" class="btn btn-sm btn-primary"><i class="fas fa-paper-plane"></i> Send Reply</button>' +
                            '<button onclick="toggleReply(' + inquiry.id + ')" class="btn btn-sm btn-secondary">Cancel</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function filterInquiries(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            if (btn) btn.classList.add('active');
            loadInquiries();
        }

        function markRead(id) {
            var inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
            var inquiry = inquiries.find(function(i) { return i.id === id; });
            if (inquiry && inquiry.status === 'new') {
                inquiry.status = 'read';
                inquiry.read = true;
                localStorage.setItem('inquiries', JSON.stringify(inquiries));
                loadInquiries();
                showAlert('Inquiry marked as read.', 'success');
            }
        }

        function toggleReply(id) {
            var box = document.getElementById('reply-' + id);
            box.classList.toggle('show');
            if (box.classList.contains('show')) {
                document.getElementById('replyText-' + id).focus();
            }
        }

        function sendReply(id) {
            var textarea = document.getElementById('replyText-' + id);
            var reply = textarea.value.trim();
            if (!reply) {
                showAlert('Please type a reply first.', 'danger');
                return;
            }

            var inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
            var inquiry = inquiries.find(function(i) { return i.id === id; });
            if (inquiry) {
                inquiry.status = 'replied';
                inquiry.reply = reply;
                inquiry.replyDate = new Date().toISOString();
                localStorage.setItem('inquiries', JSON.stringify(inquiries));
                textarea.value = '';
                document.getElementById('reply-' + id).classList.remove('show');
                loadInquiries();
                showAlert('Reply sent successfully!', 'success');
            }
        }

        function markClosed(id) {
            if (confirm('Close this inquiry?')) {
                var inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
                var inquiry = inquiries.find(function(i) { return i.id === id; });
                if (inquiry) {
                    inquiry.status = 'closed';
                    localStorage.setItem('inquiries', JSON.stringify(inquiries));
                    loadInquiries();
                    showAlert('Inquiry closed.', 'success');
                }
            }
        }

        function deleteInquiry(id) {
            if (confirm('Delete this inquiry?')) {
                var inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
                inquiries = inquiries.filter(function(i) { return i.id !== id; });
                localStorage.setItem('inquiries', JSON.stringify(inquiries));
                loadInquiries();
                showAlert('Inquiry deleted.', 'success');
            }
        }

        function showAlert(message, type) {
            var container = document.getElementById('alertContainer');
            if (!container) return;
            var alert = document.createElement('div');
            alert.className = 'alert alert-' + type;
            alert.innerHTML = message + ' <button onclick="this.parentElement.remove()" style="float:right;background:none;border:none;font-size:18px;cursor:pointer;">&times;</button>';
            container.appendChild(alert);
            setTimeout(function() { if (alert.parentElement) alert.remove(); }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadInquiries();
        });
    </script>
</body>
