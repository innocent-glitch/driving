<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2>
                <i class="fas fa-car" style="color: #dc2626;"></i>
                <div>
                    EXCEL INSTITUTE
                    <span class="subtitle">Driving School</span>
                </div>
            </h2>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-label">Main</li>
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="students.html" class="active"><i class="fas fa-users"></i> Students</a></li>
            <li><a href="instructors.html"><i class="fas fa-chalkboard-teacher"></i> Instructors</a></li>
            <li><a href="vehicles.html"><i class="fas fa-car"></i> Vehicles</a></li>
            <li><a href="lessons.html"><i class="fas fa-calendar-alt"></i> Lessons</a></li>
            <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> Payments</a></li>
            <li><a href="inquiries.html"><i class="fas fa-envelope"></i> Inquiries</a></li>
            <li class="menu-label">Reports</li>
            <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
        <li><a href="student-portal.html"><i class="fas fa-user-graduate"></i> student portal</a></li>
</ul>
    </nav>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-nav">
            <div class="top-nav-left">
                <button class="mobile-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Add Student</h1>
            </div>
            <div class="top-nav-right">
                <div class="user-profile" onclick="handleLogout()">
                    <div class="user-avatar">A</div>
                    <span>Admin</span>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="form-container">
            <form id="studentForm" onsubmit="handleStudentSubmit(event)">
                <input type="hidden" id="editStudentId" value="">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone <span class="required">*</span></label>
                        <input type="tel" class="form-control" id="phone" placeholder="0712345678" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>National ID <span class="required">*</span></label>
                        <input type="text" class="form-control" id="nationalId" placeholder="12345678" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" id="email" placeholder="student@email.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>License Class <span class="required">*</span></label>
                        <select class="form-control" id="licenseClass" required>
                            <option value="">Select Class</option>
                            <option value="B">Class B - Light Vehicle</option>
                            <option value="C">Class C - Medium Vehicle</option>
                            <option value="D">Class D - Heavy Vehicle</option>
                            <option value="E">Class E - Motorcycle</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Enrollment Date <span class="required">*</span></label>
                        <input type="date" class="form-control" id="enrollmentDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea class="form-control" id="address" rows="2" placeholder="Enter address"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i> Register Student
                    </button>
                    <a href="students.html" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // ============================================
        // STUDENT ADD/EDIT - FIXED
        // ============================================

        document.addEventListener('DOMContentLoaded', function() {
            var urlParams = new URLSearchParams(window.location.search);
            var editId = urlParams.get('id');
            
            if (editId) {
                // Load student data for editing
                var students = JSON.parse(localStorage.getItem('students')) || [];
                var student = students.find(function(s) { return s.id === parseInt(editId); });
                
                if (student) {
                    document.getElementById('editStudentId').value = student.id;
                    document.getElementById('fullName').value = student.fullName || '';
                    document.getElementById('phone').value = student.phone || '';
                    document.getElementById('nationalId').value = student.nationalId || '';
                    document.getElementById('email').value = student.email || '';
                    document.getElementById('licenseClass').value = student.licenseClass || '';
                    document.getElementById('enrollmentDate').value = student.enrollmentDate || '';
                    document.getElementById('address').value = student.address || '';
                    document.getElementById('pageTitle').textContent = 'Edit Student';
                    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Student';
                }
            }
        });

        // This function is called when the form is submitted
        function handleStudentSubmit(event) {
            event.preventDefault();
            
            // Get form values
            var fullName = document.getElementById('fullName').value;
            var phone = document.getElementById('phone').value;
            var nationalId = document.getElementById('nationalId').value;
            var email = document.getElementById('email').value;
            var licenseClass = document.getElementById('licenseClass').value;
            var enrollmentDate = document.getElementById('enrollmentDate').value;
            var address = document.getElementById('address').value;

            // Validate
            if (!fullName || !phone || !nationalId || !licenseClass || !enrollmentDate) {
                showAlert('Please fill in all required fields.', 'danger');
                return;
            }

            // Get existing students
            var students = JSON.parse(localStorage.getItem('students')) || [];
            
            // Check if editing
            var editId = document.getElementById('editStudentId').value;

            if (editId) {
                // EDIT EXISTING STUDENT
                var index = students.findIndex(function(s) { return s.id === parseInt(editId); });
                if (index !== -1) {
                    students[index] = {
                        id: students[index].id,
                        studentNo: students[index].studentNo,
                        fullName: fullName,
                        phone: phone,
                        nationalId: nationalId,
                        email: email,
                        licenseClass: licenseClass,
                        enrollmentDate: enrollmentDate,
                        status: students[index].status || 'active',
                        address: address
                    };
                    localStorage.setItem('students', JSON.stringify(students));
                    showAlert('Student updated successfully!', 'success');
                    setTimeout(function() { window.location.href = 'students.html'; }, 1500);
                }
            } else {
                // ADD NEW STUDENT
                var newStudent = {
                    id: students.length > 0 ? Math.max.apply(null, students.map(function(s) { return s.id; })) + 1 : 1,
                    studentNo: 'ST' + new Date().getFullYear() + String(students.length + 1).padStart(4, '0'),
                    fullName: fullName,
                    phone: phone,
                    nationalId: nationalId,
                    email: email,
                    licenseClass: licenseClass,
                    enrollmentDate: enrollmentDate,
                    status: 'active',
                    address: address
                };
                students.push(newStudent);
                localStorage.setItem('students', JSON.stringify(students));
                
                // Show success message
                showAlert('Student registered successfully! Student No: ' + newStudent.studentNo, 'success');
                
                // Redirect after 1.5 seconds
                setTimeout(function() { window.location.href = 'students.html'; }, 1500);
            }
        }
    </script>
</body>
</html>
