<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ... same sidebar styles as above ... */
        .admin-only { display: block; }
        .admin-instructor { display: block; }
    </style>
</head>
<body>
    <!-- ... same sidebar as above ... -->
    
    <div class="main-content">
        <!-- ... top nav ... -->
        
        <div class="table-container">
            <div class="table-header">
                <h3><i class="fas fa-list"></i> All Lessons</h3>
                <div class="table-toolbar">
                    <!-- Only Admin can schedule lessons, Instructor can view -->
                    <a href="lesson-add.html" class="btn btn-primary admin-only">
                        <i class="fas fa-plus"></i> Schedule Lesson
                    </a>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Instructor</th>
                            <th>Vehicle</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="lessonsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ADMIN + INSTRUCTOR ACCESS CONTROL
        // ============================================
        function getCurrentUser() {
            return JSON.parse(localStorage.getItem('user') || 'null');
        }

        function restrictToAdminInstructor() {
            var user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return false;
            }
            if (user.role !== 'admin' && user.role !== 'instructor') {
                alert('⛔ Access Denied! Only Admin and Instructors can access this page.');
                window.location.href = 'dashboard.html';
                return false;
            }
            return true;
        }

        (function() {
            if (!restrictToAdminInstructor()) {
                return;
            }
        })();

        // ============================================
        // PAGE FUNCTIONS
        // ============================================
        
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('show');
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('user');
                localStorage.removeItem('userRole');
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
            }
        }

        function loadLessons() {
            var tbody = document.getElementById('lessonsTableBody');
            if (!tbody) return;
            
            var lessons = JSON.parse(localStorage.getItem('lessons')) || [];
            var students = JSON.parse(localStorage.getItem('students')) || [];
            var instructors = JSON.parse(localStorage.getItem('instructors')) || [];
            var vehicles = JSON.parse(localStorage.getItem('vehicles')) || [];
            var user = getCurrentUser();
            var isAdminUser = user && user.role === 'admin';
            
            // If instructor, only show their lessons
            var filteredLessons = lessons;
            if (user && user.role === 'instructor') {
                // Find instructor by name or email
                var instructor = instructors.find(function(i) { 
                    return i.fullName === user.name || i.email === user.email; 
                });
                if (instructor) {
                    filteredLessons = lessons.filter(function(l) { 
                        return l.instructorId === instructor.id; 
                    });
                }
            }

            if (filteredLessons.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: rgba(255,255,255,0.6);"><i class="fas fa-calendar-alt" style="font-size: 40px; display: block; margin-bottom: 10px;"></i>No lessons found</td></tr>';
                return;
            }

            var html = '';
            filteredLessons.forEach(function(lesson) {
                var student = students.find(function(s) { return s.id === lesson.studentId; });
                var instructor = instructors.find(function(i) { return i.id === lesson.instructorId; });
                var vehicle = vehicles.find(function(v) { return v.id === lesson.vehicleId; });
                var statusClass = lesson.status === 'completed' ? 'badge-success' : lesson.status === 'cancelled' ? 'badge-danger' : 'badge-warning';
                var statusText = lesson.status ? lesson.status.charAt(0).toUpperCase() + lesson.status.slice(1) : 'Scheduled';
                
                html += '<tr>' +
                    '<td>' + (student ? student.fullName : 'N/A') + '</td>' +
                    '<td>' + (instructor ? instructor.fullName : 'N/A') + '</td>' +
                    '<td>' + (vehicle ? vehicle.registrationNo : 'N/A') + '</td>' +
                    '<td>' + (lesson.lessonDate || 'N/A') + '</td>' +
                    '<td>' + (lesson.startTime || 'N/A') + ' - ' + (lesson.endTime || 'N/A') + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + statusText + '</span></td>' +
                    '<td>' +
                        (isAdminUser ? 
                            '<button onclick="deleteLesson(' + lesson.id + ')" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>' :
                            '<span class="badge badge-info">View Only</span>'
                        ) +
                    '</td>' +
                '</tr>';
            });
            tbody.innerHTML = html;
        }

        function deleteLesson(id) {
            if (confirm('Delete this lesson?')) {
                var lessons = JSON.parse(localStorage.getItem('lessons')) || [];
                lessons = lessons.filter(function(l) { return l.id !== id; });
                localStorage.setItem('lessons', JSON.stringify(lessons));
                loadLessons();
                showAlert('Lesson deleted successfully!', 'success');
            }
        }

        function showAlert(message, type) {
            var container = document.getElementById('alertContainer');
            if (!container) return;
            var alert = document.createElement('div');
            alert.className = 'alert alert-' + type;
            alert.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i> ' + message + ' <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>';
            container.appendChild(alert);
            setTimeout(function() { if (alert.parentElement) alert.remove(); }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (restrictToAdminInstructor()) {
                loadLessons();
                var user = getCurrentUser();
                var avatar = document.getElementById('userAvatar');
                var nameSpan = document.getElementById('userNameDisplay');
                if (user && avatar) avatar.textContent = user.name.charAt(0).toUpperCase();
                if (user && nameSpan) nameSpan.textContent = user.name + ' (' + (user.role.charAt(0).toUpperCase() + user.role.slice(1)) + ')';
            }
        });
    </script>
</body>
</html>
