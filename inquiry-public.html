<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .inquiry-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            padding: 40px 20px;
        }
        .inquiry-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .inquiry-header { text-align: center; margin-bottom: 30px; }
        .inquiry-header .logo-icon {
            background: #dc2626;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .inquiry-header .logo-icon i { font-size: 32px; color: white; }
        .inquiry-header h1 { color: #dc2626; font-size: 24px; margin-bottom: 5px; }
        .inquiry-header .subtitle { color: #16a34a; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
        .inquiry-header p { color: var(--secondary); font-size: 14px; margin-top: 5px; }

        .inquiry-form .form-group { margin-bottom: 18px; }
        .inquiry-form .form-group label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 5px; }
        .inquiry-form .form-group .required { color: #dc2626; }
        .inquiry-form .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .inquiry-form .form-control:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        .inquiry-form textarea { resize: vertical; min-height: 120px; }

        .btn-submit-inquiry {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-submit-inquiry:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }
        .btn-submit-inquiry i { margin-right: 8px; }

        .inquiry-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--gray);
            font-size: 13px;
        }
        .inquiry-footer a { color: #dc2626; text-decoration: none; }

        .success-message { text-align: center; padding: 40px 20px; }
        .success-message i { font-size: 60px; color: #16a34a; margin-bottom: 20px; }
        .success-message h2 { color: #16a34a; }
        .success-message p { color: var(--secondary); margin-top: 10px; }
        .success-message .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 30px;
            background: #16a34a;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }
        .success-message .btn-home:hover { background: #15803d; }
        .hidden { display: none !important; }

        .alert-box {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-box.success { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
        .alert-box.danger { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
        .alert-box i { font-size: 18px; }
        .alert-box .close-btn { margin-left: auto; background: none; border: none; font-size: 18px; cursor: pointer; color: inherit; }

        @media (max-width: 480px) { .inquiry-container { padding: 20px; } }
    </style>
</head>
<body>
    <div class="inquiry-page">
        <div class="inquiry-container">
            <div class="inquiry-header">
                <div class="logo-icon"><i class="fas fa-car"></i></div>
                <h1>EXCEL INSTITUTE</h1>
                <div class="subtitle">DRIVING SCHOOL</div>
                <p>Fill in the form below and we'll get back to you</p>
            </div>

            <div id="alertContainer"></div>

            <div id="inquiryFormWrapper">
                <form id="inquiryForm" class="inquiry-form" onsubmit="submitInquiry(event)">
                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" class="form-control" id="inqName" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number <span class="required">*</span></label>
                        <input type="tel" class="form-control" id="inqPhone" placeholder="0712345678" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" id="inqEmail" placeholder="you@email.com">
                    </div>

                    <div class="form-group">
                        <label>Subject <span class="required">*</span></label>
                        <select class="form-control" id="inqSubject" required>
                            <option value="">Select Subject</option>
                            <option value="General Inquiry">General Inquiry</option>
                            <option value="Driving Lessons">Driving Lessons</option>
                            <option value="Class B - Light Vehicle">Class B - Light Vehicle</option>
                            <option value="Class C - Medium Vehicle">Class C - Medium Vehicle</option>
                            <option value="Class D - Heavy Vehicle">Class D - Heavy Vehicle</option>
                            <option value="Class E - Motorcycle">Class E - Motorcycle</option>
                            <option value="Refresher Course">Refresher Course</option>
                            <option value="Defensive Driving">Defensive Driving</option>
                            <option value="Pricing Inquiry">Pricing Inquiry</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Your Message <span class="required">*</span></label>
                        <textarea class="form-control" id="inqMessage" placeholder="Tell us what you need..." rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit-inquiry">
                        <i class="fas fa-paper-plane"></i> Send Inquiry
                    </button>
                </form>
            </div>

            <div id="inquirySuccess" class="hidden">
                <div class="success-message">
                    <i class="fas fa-check-circle"></i>
                    <h2>Inquiry Sent Successfully!</h2>
                    <p>Thank you for contacting EXCEL INSTITUTE Driving School.<br>We will get back to you within 24 hours.</p>
                    <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Back to Home</a>
                </div>
            </div>

            <div class="inquiry-footer">
                <p>📞 Call us: +254 700 000 000 &nbsp;|&nbsp; 📧 <a href="mailto:info@excelinstitute.com">info@excelinstitute.com</a></p>
            </div>
        </div>
    </div>

    <script>
        function submitInquiry(event) {
            event.preventDefault();

            var name = document.getElementById('inqName').value;
            var phone = document.getElementById('inqPhone').value;
            var email = document.getElementById('inqEmail').value || 'Not provided';
            var subject = document.getElementById('inqSubject').value;
            var message = document.getElementById('inqMessage').value;

            if (!name || !phone || !subject || !message) {
                showAlert('Please fill in all required fields.', 'danger');
                return;
            }

            var inquiry = {
                id: Date.now(),
                name: name,
                phone: phone,
                email: email,
                subject: subject,
                message: message,
                date: new Date().toISOString(),
                status: 'new',
                read: false
            };

            var inquiries = JSON.parse(localStorage.getItem('inquiries') || '[]');
            inquiries.unshift(inquiry);
            localStorage.setItem('inquiries', JSON.stringify(inquiries));

            document.getElementById('inquiryFormWrapper').classList.add('hidden');
            document.getElementById('inquirySuccess').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showAlert(message, type) {
            var container = document.getElementById('alertContainer');
            if (!container) return;

            var alert = document.createElement('div');
            alert.className = 'alert-box ' + type;
            alert.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i> ' + message + ' <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>';
            container.appendChild(alert);

            setTimeout(function() { if (alert.parentElement) alert.remove(); }, 5000);
        }
    </script>
</body>
</html>
