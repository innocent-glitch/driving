<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%);
            padding: 20px;
        }
        .auth-card {
            background: linear-gradient(135deg, #16a34a, #15803d);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo .logo-icon {
            background: #fbbf24;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        .auth-logo .logo-icon i { font-size: 32px; color: #7f1d1d; }
        .auth-logo h2 { font-size: 24px; font-weight: 700; color: white; }
        .auth-logo .subtitle { color: #fbbf24; font-size: 14px; font-weight: 600; letter-spacing: 2px; }
        .auth-logo p { color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 5px; color: white; }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.5); }
        .form-control:focus {
            outline: none;
            border-color: #fbbf24;
            background: rgba(255,255,255,0.15);
        }
        .btn-primary {
            background: #fbbf24;
            color: #7f1d1d;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover { background: #fcd34d; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: rgba(255,255,255,0.7); }
        .auth-footer a { color: #fbbf24; text-decoration: none; font-weight: 500; }
        .auth-footer a:hover { text-decoration: underline; }
        .login-role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .role-option {
            padding: 8px 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7);
            text-align: center;
        }
        .role-option:hover { border-color: #fbbf24; color: white; }
        .role-option.active { border-color: #fbbf24; background: rgba(251, 191, 36, 0.2); color: white; }
        .role-option i { margin-right: 4px; }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-success { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
        .alert-danger { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
        @media (max-width: 480px) { .auth-card { padding: 25px; } .login-role-selector { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="auth-card fade-in">
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-car"></i></div>
            <h2>EXCEL INSTITUTE</h2>
            <div class="subtitle">DRIVING SCHOOL</div>
            <p>Login to your account</p>
        </div>

        <div id="alertMessage"></div>

        <div class="login-role-selector">
            <div class="role-option active" data-role="admin" onclick="selectRole('admin')">
                <i class="fas fa-user-shield"></i> Admin
            </div>
            <div class="role-option" data-role="instructor" onclick="selectRole('instructor')">
                <i class="fas fa-chalkboard-teacher"></i> Instructor
            </div>
            <div class="role-option" data-role="receptionist" onclick="selectRole('receptionist')">
                <i class="fas fa-headset"></i> Receptionist
            </div>
            <div class="role-option" data-role="student" onclick="selectRole('student')">
                <i class="fas fa-user-graduate"></i> Student
            </div>
        </div>

        <form id="loginForm" onsubmit="handleEmployeeLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; color: rgba(255,255,255,0.8);">
                    <input type="checkbox"> Remember me
                </label>
                <a href="forgot-password.html" style="color: #fbbf24; text-decoration: none; font-size: 14px;">Forgot password?</a>
            </div>
            <button type="submit" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        var selectedRole = 'admin';

        function selectRole(role) {
            selectedRole = role;
            var options = document.querySelectorAll('.role-option');
            options.forEach(function(opt) {
                opt.classList.remove('active');
                if (opt.dataset.role === role) {
                    opt.classList.add('active');
                }
            });
        }

        function handleEmployeeLogin(event) {
            event.preventDefault();
            var email = document.getElementById('loginEmail').value;
            var password = document.getElementById('loginPassword').value;

            var users = JSON.parse(localStorage.getItem('users') || '[]');
            var user = users.find(function(u) { 
                return u.email === email && u.password === password && u.status === 'active';
            });

            if (user) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('user', JSON.stringify(user));
                localStorage.setItem('userRole', user.role);
                localStorage.setItem('userName', user.name);
                showAlert('Welcome back, ' + user.name + '!', 'success');
                setTimeout(function() { window.location.href = 'dashboard.html'; }, 500);
            } else {
                showAlert('Invalid email or password. Please try again.', 'danger');
            }
        }

        function showAlert(message, type) {
            var container = document.getElementById('alertMessage');
            if (!container) return;
            var alert = document.createElement('div');
            alert.className = 'alert alert-' + type;
            alert.innerHTML = message + ' <button onclick="this.parentElement.remove()" style="float:right;background:none;border:none;font-size:18px;cursor:pointer;">&times;</button>';
            container.appendChild(alert);
            setTimeout(function() { if (alert.parentElement) alert.remove(); }, 5000);
        }
    </script>
</body>
</html>
