<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Instructor - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2>
                <i class="fas fa-car" style="color: #dc2626;"></i>
                <div>
                    EXCEL INSTITUTE
                    <span class="subtitle">Driving School</span>
                </div>
            </h2>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-label">Main</li>
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
            <li><a href="instructors.html" class="active"><i class="fas fa-chalkboard-teacher"></i> Instructors</a></li>
            <li><a href="vehicles.html"><i class="fas fa-car"></i> Vehicles</a></li>
            <li><a href="lessons.html"><i class="fas fa-calendar-alt"></i> Lessons</a></li>
            <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> Payments</a></li>
            <li class="menu-label">Reports</li>
            <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
        <li><a href="student-portal.html"><i class="fas fa-user-graduate"></i> student portal</a></li>
</ul>
    </nav>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-nav">
            <div class="top-nav-left">
                <button class="mobile-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Add Instructor</h1>
            </div>
            <div class="top-nav-right">
                <div class="user-profile" onclick="handleLogout()">
                    <div class="user-avatar">A</div>
                    <span>Admin</span>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="form-container">
            <form id="instructorForm" onsubmit="handleInstructorSubmit(event)">
                <input type="hidden" id="editInstructorId" value="">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone <span class="required">*</span></label>
                        <input type="tel" class="form-control" id="phone" placeholder="0712345678" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>License Number <span class="required">*</span></label>
                        <input type="text" class="form-control" id="licenseNumber" placeholder="DL123456" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" id="email" placeholder="instructor@email.com">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i> Add Instructor
                    </button>
                    <a href="instructors.html" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var urlParams = new URLSearchParams(window.location.search);
            var id = urlParams.get('id');
            
            if (id) {
                loadInstructorForEdit(parseInt(id));
            }
        });

        function loadInstructorForEdit(id) {
            var instructors = JSON.parse(localStorage.getItem('instructors')) || [];
            var instructor = instructors.find(function(i) { return i.id === id; });
            
            if (instructor) {
                document.getElementById('editInstructorId').value = instructor.id;
                document.getElementById('fullName').value = instructor.fullName;
                document.getElementById('phone').value = instructor.phone;
                document.getElementById('licenseNumber').value = instructor.licenseNumber;
                document.getElementById('email').value = instructor.email || '';
                document.getElementById('pageTitle').textContent = 'Edit Instructor';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Instructor';
            }
        }

        function handleInstructorSubmit(event) {
            event.preventDefault();
            
            var editId = document.getElementById('editInstructorId').value;
            var fullName = document.getElementById('fullName').value;
            var phone = document.getElementById('phone').value;
            var licenseNumber = document.getElementById('licenseNumber').value;
            var email = document.getElementById('email').value;

            var instructors = JSON.parse(localStorage.getItem('instructors')) || [];

            if (editId) {
                var index = instructors.findIndex(function(i) { return i.id === parseInt(editId); });
                if (index !== -1) {
                    instructors[index] = {
                        id: instructors[index].id,
                        staffNo: instructors[index].staffNo,
                        fullName: fullName,
                        phone: phone,
                        licenseNumber: licenseNumber,
                        email: email,
                        status: instructors[index].status
                    };
                    localStorage.setItem('instructors', JSON.stringify(instructors));
                    showAlert('Instructor updated successfully!', 'success');
                    setTimeout(function() { window.location.href = 'instructors.html'; }, 1500);
                }
            } else {
                var newInstructor = {
                    id: instructors.length > 0 ? Math.max.apply(null, instructors.map(function(i) { return i.id; })) + 1 : 1,
                    staffNo: 'INS' + String(instructors.length + 1).padStart(3, '0'),
                    fullName: fullName,
                    phone: phone,
                    licenseNumber: licenseNumber,
                    email: email,
                    status: 'active'
                };
                instructors.push(newInstructor);
                localStorage.setItem('instructors', JSON.stringify(instructors));
                showAlert('Instructor added successfully! Staff No: ' + newInstructor.staffNo, 'success');
                setTimeout(function() { window.location.href = 'instructors.html'; }, 1500);
            }
        }
    </script>
</body>
</html>
