<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Instructor - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0fdf4;
            color: #1e293b;
            line-height: 1.6;
            display: flex;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 270px;
            height: 100%;
            background: linear-gradient(180deg, #dc2626 0%, #b91c1c 40%, #7f1d1d 100%);
            padding: 20px 0;
            overflow-y: auto;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,0.2);
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            margin-bottom: 20px;
        }
        .sidebar-brand h2 {
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 700;
        }
        .sidebar-brand h2 i {
            font-size: 28px;
            color: #fbbf24;
            background: rgba(255,255,255,0.12);
            padding: 10px 12px;
            border-radius: 12px;
        }
        .sidebar-brand .subtitle {
            font-size: 10px;
            color: #fca5a5;
            font-weight: 400;
            display: block;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0 14px;
        }
        .sidebar-menu .menu-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #fca5a5;
            padding: 12px 16px 6px;
            font-weight: 700;
            letter-spacing: 1.5px;
            opacity: 0.7;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 16px;
            color: #fecaca;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }
        .sidebar-menu a:hover {
            background: rgba(255,255,255,0.12);
            color: white;
            transform: translateX(4px);
        }
        .sidebar-menu a.active {
            background: #fbbf24;
            color: #7f1d1d;
            box-shadow: 0 4px 16px rgba(251,191,36,0.35);
        }
        .sidebar-menu a i {
            width: 20px;
            font-size: 16px;
            text-align: center;
        }

        .main-content {
            margin-left: 270px;
            padding: 25px 35px;
            min-height: 100vh;
            width: 100%;
            background: #f0fdf4;
        }

        .top-nav {
            background: linear-gradient(135deg, #16a34a, #15803d);
            padding: 14px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(22,163,74,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .top-nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .top-nav-left h1 {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin: 0;
        }
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: white;
            cursor: pointer;
            padding: 5px;
        }
        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 6px 14px 6px 6px;
            border-radius: 50px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.12);
        }
        .user-profile:hover {
            background: rgba(255,255,255,0.22);
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fbbf24;
            color: #7f1d1d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }
        .user-profile span {
            font-size: 14px;
            font-weight: 500;
            color: white;
        }

        .form-container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 20px;
            max-width: 800px;
        }
        .form-container h2 {
            color: #1e293b;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .form-container h2 i {
            color: #dc2626;
            margin-right: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            color: #1e293b;
        }
        .form-group .required {
            color: #dc2626;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: white;
        }
        .form-control:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
        }
        .form-control::placeholder {
            color: #9ca3af;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(220,38,38,0.3);
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        .btn-secondary:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-success {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
        }
        .alert-danger {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }
        .alert i { font-size: 18px; }
        .alert .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: inherit;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        .overlay.show { display: block; }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .main-content {
                margin-left: 0;
                padding: 15px;
            }
            .mobile-toggle {
                display: block !important;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .top-nav-left h1 { font-size: 18px; }
            .user-profile span { display: none; }
            .form-container { padding: 20px; }
        }
        @media (max-width: 480px) {
            .main-content { padding: 10px; }
            .top-nav { padding: 12px 15px; flex-wrap: wrap; gap: 10px; }
            .form-container { padding: 15px; }
            .form-actions { flex-direction: column; }
            .form-actions .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2>
                <i class="fas fa-car"></i>
                <div>
                    EXCEL INSTITUTE
                    <span class="subtitle">Driving School</span>
                </div>
            </h2>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-label">Main</li>
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
            <li><a href="instructors.html" class="active"><i class="fas fa-chalkboard-teacher"></i> Instructors</a></li>
            <li><a href="vehicles.html"><i class="fas fa-car"></i> Vehicles</a></li>
            <li><a href="lessons.html"><i class="fas fa-calendar-alt"></i> Lessons</a></li>
            <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> Payments</a></li>
            <li><a href="inquiries.html"><i class="fas fa-envelope"></i> Inquiries</a></li>
            <li><a href="student-inquiry.html"><i class="fas fa-pen"></i> Submit Inquiry</a></li>
            <li><a href="student-portal.html"><i class="fas fa-user-graduate"></i> Student Portal</a></li>
            <li class="menu-label">Reports</li>
            <li><a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
            <li><a href="change-password.html"><i class="fas fa-key"></i> Change Password</a></li>
        </ul>
    </nav>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div class="top-nav">
            <div class="top-nav-left">
                <button class="mobile-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Add Instructor</h1>
            </div>
            <div class="top-nav-right">
                <div class="user-profile" onclick="handleLogout()">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <span id="userNameDisplay">Admin</span>
                </div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="form-container">
            <h2><i class="fas fa-chalkboard-teacher"></i> <span id="formTitle">Add New Instructor</span></h2>
            <form id="instructorForm" onsubmit="handleInstructorSubmit(event)">
                <input type="hidden" id="editInstructorId" value="">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone <span class="required">*</span></label>
                        <input type="tel" class="form-control" id="phone" placeholder="0712345678" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>License Number <span class="required">*</span></label>
                        <input type="text" class="form-control" id="licenseNumber" placeholder="DL123456" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" id="email" placeholder="instructor@email.com">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i> Add Instructor
                    </button>
                    <a href="instructors.html" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('show');
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('user');
                localStorage.removeItem('userRole');
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
            }
        }

        function showAlert(message, type) {
            var container = document.getElementById('alertContainer');
            if (!container) return;
            var alert = document.createElement('div');
            alert.className = 'alert alert-' + type;
            alert.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i> ' + message + ' <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>';
            container.appendChild(alert);
            setTimeout(function() { if (alert.parentElement) alert.remove(); }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            var urlParams = new URLSearchParams(window.location.search);
            var id = urlParams.get('id');
            
            if (id) {
                var instructors = JSON.parse(localStorage.getItem('instructors')) || [];
                var instructor = instructors.find(function(i) { return i.id === parseInt(id); });
                if (instructor) {
                    document.getElementById('editInstructorId').value = instructor.id;
                    document.getElementById('fullName').value = instructor.fullName || '';
                    document.getElementById('phone').value = instructor.phone || '';
                    document.getElementById('licenseNumber').value = instructor.licenseNumber || '';
                    document.getElementById('email').value = instructor.email || '';
                    document.getElementById('pageTitle').textContent = 'Edit Instructor';
                    document.getElementById('formTitle').textContent = 'Edit Instructor Details';
                    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Instructor';
                }
            }

            var user = JSON.parse(localStorage.getItem('user') || 'null');
            var avatar = document.getElementById('userAvatar');
            var nameSpan = document.getElementById('userNameDisplay');
            if (user && avatar) avatar.textContent = user.name.charAt(0).toUpperCase();
            if (user && nameSpan) nameSpan.textContent = user.name + ' (' + (user.role.charAt(0).toUpperCase() + user.role.slice(1)) + ')';
        });

        function handleInstructorSubmit(event) {
            event.preventDefault();
            
            var fullName = document.getElementById('fullName').value;
            var phone = document.getElementById('phone').value;
            var licenseNumber = document.getElementById('licenseNumber').value;
            var email = document.getElementById('email').value;
            var editId = document.getElementById('editInstructorId').value;

            if (!fullName || !phone || !licenseNumber) {
                showAlert('Please fill in all required fields.', 'danger');
                return;
            }

            var instructors = JSON.parse(localStorage.getItem('instructors')) || [];

            if (editId) {
                var index = instructors.findIndex(function(i) { return i.id === parseInt(editId); });
                if (index !== -1) {
                    instructors[index] = {
                        id: instructors[index].id,
                        staffNo: instructors[index].staffNo,
                        fullName: fullName,
                        phone: phone,
                        licenseNumber: licenseNumber,
                        email: email,
                        status: instructors[index].status || 'active'
                    };
                    localStorage.setItem('instructors', JSON.stringify(instructors));
                    showAlert('Instructor updated successfully!', 'success');
                    setTimeout(function() { window.location.href = 'instructors.html'; }, 1500);
                }
            } else {
                var newInstructor = {
                    id: instructors.length > 0 ? Math.max.apply(null, instructors.map(function(i) { return i.id; })) + 1 : 1,
                    staffNo: 'INS' + String(instructors.length + 1).padStart(3, '0'),
                    fullName: fullName,
                    phone: phone,
                    licenseNumber: licenseNumber,
                    email: email,
                    status: 'active'
                };
                instructors.push(newInstructor);
                localStorage.setItem('instructors', JSON.stringify(instructors));
                showAlert('Instructor added successfully! Staff No: ' + newInstructor.staffNo, 'success');
                setTimeout(function() { window.location.href = 'instructors.html'; }, 1500);
            }
        }
    </script>
</body>
</html>
