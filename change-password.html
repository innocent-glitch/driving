<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - EXCEL INSTITUTE Driving School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .change-password-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .change-password-container h2 {
            color: #dc2626;
            text-align: center;
            margin-bottom: 30px;
        }
        .change-password-container h2 i {
            margin-right: 10px;
        }
        .password-hint {
            background: #f0fdf4;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #16a34a;
            font-size: 13px;
            color: var(--secondary);
        }
        .password-hint strong {
            color: var(--dark);
        }
        .form-group .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group .form-control:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        .btn-change-password {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-change-password:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .btn-change-password i {
            margin-right: 8px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--gray);
            text-decoration: none;
        }
        .back-link:hover {
            color: #dc2626;
        }
        .alert-box {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-box.success { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
        .alert-box.danger { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
        .alert-box i { font-size: 18px; }
        .alert-box .close-btn { margin-left: auto; background: none; border: none; font-size: 18px; cursor: pointer; color: inherit; }
        .password-requirements {
            font-size: 12px;
            color: var(--gray);
            margin-top: 5px;
        }
        .password-requirements .valid { color: #16a34a; }
        .password-requirements .invalid { color: #dc2626; }
    </style>
</head>
<body>
    <div class="change-password-container">
        <h2><i class="fas fa-key"></i> Change Password</h2>
        
        <div id="alertContainer"></div>
        
        <div class="password-hint">
            <i class="fas fa-info-circle" style="color: #16a34a;"></i>
            <strong>Password Requirements:</strong>
            <ul style="margin: 5px 0 0 20px; font-size: 12px;">
                <li>Minimum 6 characters</li>
                <li>Use a mix of letters and numbers</li>
                <li>Avoid common words like "password"</li>
                <li><a href="student-portal.html"><i class="fas fa-user-graduate"></i> Student Portal</a></li>
<li><a href="student-portal.html"><i class="fas fa-user-graduate"></i> student portal</a></li>
</ul>
            <li><a href="student-portal.html"><i class="fas fa-user-graduate"></i> student portal</a></li>
</ul>
        </div>

        <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
            <div class="form-group">
                <label>Current Password <span class="required">*</span></label>
                <input type="password" class="form-control" id="currentPassword" placeholder="Enter your current password" required>
            </div>
            
            <div class="form-group">
                <label>New Password <span class="required">*</span></label>
                <input type="password" class="form-control" id="newPassword" placeholder="Enter your new password" required minlength="6">
                <div class="password-requirements" id="passwordRequirements">
                    <span id="lengthCheck" class="invalid">✗ At least 6 characters</span>
                    <span id="numberCheck" class="invalid">✗ Contains a number</span>
                </div>
            </div>
            
            <div class="form-group">
                <label>Confirm New Password <span class="required">*</span></label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your new password" required>
            </div>
            
            <button type="submit" class="btn-change-password">
                <i class="fas fa-save"></i> Update Password
            </button>
        </form>
        
        <a href="dashboard.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Real-time password validation
        document.getElementById('newPassword').addEventListener('input', function() {
            var password = this.value;
            var lengthCheck = document.getElementById('lengthCheck');
            var numberCheck = document.getElementById('numberCheck');
            
            if (password.length >= 6) {
                lengthCheck.textContent = '✓ At least 6 characters';
                lengthCheck.className = 'valid';
            } else {
                lengthCheck.textContent = '✗ At least 6 characters';
                lengthCheck.className = 'invalid';
            }
            
            if (/\d/.test(password)) {
                numberCheck.textContent = '✓ Contains a number';
                numberCheck.className = 'valid';
            } else {
                numberCheck.textContent = '✗ Contains a number';
                numberCheck.className = 'invalid';
            }
        });

        function handleChangePassword(event) {
            event.preventDefault();
            
            var currentPassword = document.getElementById('currentPassword').value;
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            
            // Get current user
            var user = getCurrentUser();
            if (!user) {
                showAlert('Please login first!', 'danger');
                window.location.href = 'login.html';
                return;
            }
            
            // Validate
            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters!', 'danger');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match!', 'danger');
                return;
            }
            
            if (currentPassword === newPassword) {
                showAlert('New password must be different from current!', 'danger');
                return;
            }
            
            // Change password
            var success = changePassword(user.email, currentPassword, newPassword);
            
            if (success) {
                document.getElementById('changePasswordForm').reset();
                // Clear the requirements
                document.getElementById('lengthCheck').textContent = '✗ At least 6 characters';
                document.getElementById('lengthCheck').className = 'invalid';
                document.getElementById('numberCheck').textContent = '✗ Contains a number';
                document.getElementById('numberCheck').className = 'invalid';
            }
        }

        function showAlert(message, type) {
            var container = document.getElementById('alertContainer');
            if (!container) return;
            
            var alert = document.createElement('div');
            alert.className = 'alert-box ' + type;
            alert.innerHTML = '<i class="fas fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i> ' + message + ' <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>';
            container.appendChild(alert);
            
            setTimeout(function() { if (alert.parentElement) alert.remove(); }, 5000);
        }
    </script>
</body>
</html>
